<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" role="img" aria-label="CenTraL Stage 1 protocol: RNA isolation with double DNase, strand-specific RT with handled primer, single tagging cycle, ExoI cleanup, qPCR with universal primer">
  <title>CenTraL Stage 1</title>
  <desc>Animated protocol diagram for Stage 1, the strand-specific nested barcode RT-qPCR. Steps appear in sequence then the cycle restarts. Sequencing is an optional Stage 2.</desc>

  <rect x="0" y="0" width="1200" height="240" fill="#ffffff"/>

  <text x="40" y="34" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#991b1b" letter-spacing="0.5">STAGE 1<tspan font-weight="400" fill="#64748b" letter-spacing="0"> &#183; strand-specific qPCR</tspan></text>
  <line x1="40" y1="42" x2="1160" y2="42" stroke="#e2e8f0" stroke-width="1"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M2 1L9 5L2 9" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrFwd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L9 5L2 9" fill="#1e3a8a" stroke="none"/>
    </marker>
  </defs>

  <!-- Step 1: RNA isolation, double DNase -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.033;0.066;0.917;0.967;1" dur="7s" repeatCount="indefinite"/>
    <g transform="translate(40, 60)">
      <line x1="50" y1="5" x2="90" y2="5" stroke="#1e3a8a" stroke-width="1.5"/>
      <path d="M 55 5 L 55 68 Q 55 87 70 87 Q 85 87 85 68 L 85 5" fill="#eff6ff" stroke="#1e3a8a" stroke-width="1.5"/>
      <path d="M 56 40 L 84 40 L 84 68 Q 84 86 70 86 Q 56 86 56 68 Z" fill="#dbeafe" stroke="none"/>
      <g stroke="#166534" stroke-width="1.8" fill="none" stroke-linecap="round">
        <path d="M 60 52 q 4 -6 8 0 q 4 6 8 0">
          <animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/>
        </path>
        <path d="M 62 66 q 4 -6 8 0 q 4 6 8 0">
          <animate attributeName="opacity" values="1;0.5;1" dur="2.4s" repeatCount="indefinite"/>
        </path>
        <path d="M 60 77 q 4 -6 8 0">
          <animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/>
        </path>
      </g>
      <text x="70" y="140" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#0f172a">RNA isolation</text>
      <text x="70" y="154" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">double DNase, gDNA-free</text>
    </g>
  </g>

  <!-- arrow 1 + Step 2: strand-specific RT with handled primer -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.233;0.917;0.967;1" dur="7s" repeatCount="indefinite"/>
    <line x1="198" y1="112" x2="225" y2="112" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
    <g transform="translate(235, 60)">
      <path d="M 10 40 q 8 -7 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0" fill="none" stroke="#166534" stroke-width="2" stroke-linecap="round"/>
      <line x1="125" y1="54" x2="95" y2="54" stroke="#1e3a8a" stroke-width="3.5"/>
      <path d="M 125 54 L 137 43" fill="none" stroke="#d97706" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 93 54 L 25 54" fill="none" stroke="#1e3a8a" stroke-width="2" stroke-linecap="round" marker-end="url(#arrFwd)" stroke-dasharray="70" stroke-dashoffset="70">
        <animate attributeName="stroke-dashoffset" values="70;0;0;70" keyTimes="0;0.5;0.85;1" dur="3.2s" repeatCount="indefinite"/>
      </path>
      <text x="70" y="140" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#0f172a">Strand-specific RT</text>
      <text x="70" y="154" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">handled primer</text>
    </g>
  </g>

  <!-- arrow 2 + Step 3: single tagging cycle -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.367;0.4;0.917;0.967;1" dur="7s" repeatCount="indefinite"/>
    <line x1="393" y1="112" x2="420" y2="112" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
    <g transform="translate(430, 60)">
      <path d="M 15 35 q 8 -7 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0" fill="none" stroke="#166534" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
      <line x1="15" y1="58" x2="135" y2="58" stroke="#1e3a8a" stroke-width="2.5"/>
      <path d="M 15 58 L 5 47" fill="none" stroke="#d97706" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 135 58 L 145 47" fill="none" stroke="#d97706" stroke-width="3.5" stroke-linecap="round"/>
      <text x="75" y="82" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" font-style="italic" fill="#94a3b8">one cycle, gDNA stays silent</text>
      <text x="75" y="140" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#0f172a">Single tagging cycle</text>
      <text x="75" y="154" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">handle at both ends</text>
    </g>
  </g>

  <!-- arrow 3 + Step 4: ExoI cleanup -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.533;0.566;0.917;0.967;1" dur="7s" repeatCount="indefinite"/>
    <line x1="588" y1="112" x2="615" y2="112" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
    <g transform="translate(625, 60)">
      <ellipse cx="52" cy="52" rx="19" ry="15" fill="#f1f5f9" stroke="#1e3a8a" stroke-width="1.2"/>
      <text x="52" y="56" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#1e3a8a">ExoI</text>
      <g>
        <line x1="85" y1="40" x2="105" y2="40" stroke="#1e3a8a" stroke-width="3"/>
        <path d="M 105 40 L 112 33" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
        <animate attributeName="opacity" values="0.9;0.15;0.9" dur="2.4s" repeatCount="indefinite"/>
      </g>
      <g>
        <line x1="90" y1="64" x2="108" y2="64" stroke="#1e3a8a" stroke-width="3"/>
        <path d="M 90 64 L 83 57" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
        <animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.4s" repeatCount="indefinite"/>
      </g>
      <g fill="#94a3b8">
        <circle cx="120" cy="46" r="1.5"/>
        <circle cx="126" cy="54" r="1.5"/>
        <circle cx="119" cy="60" r="1.5"/>
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/>
      </g>
      <text x="70" y="140" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#0f172a">ExoI cleanup</text>
      <text x="70" y="154" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">removes free primers</text>
    </g>
  </g>

  <!-- arrow 4 + Step 5: qPCR with universal primer -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7;0.733;0.917;0.967;1" dur="7s" repeatCount="indefinite"/>
    <line x1="783" y1="112" x2="810" y2="112" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
    <g transform="translate(820, 60)">
      <line x1="10" y1="5" x2="10" y2="105" stroke="#475569" stroke-width="1"/>
      <line x1="10" y1="105" x2="150" y2="105" stroke="#475569" stroke-width="1"/>
      <line x1="12" y1="85" x2="148" y2="85" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
      <path d="M 12 104 C 90 103, 120 102, 146 97" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 12 103 C 62 102, 74 97, 88 79 S 112 45, 146 43" fill="none" stroke="#991b1b" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="200" stroke-dashoffset="200">
        <animate attributeName="stroke-dashoffset" values="200;0;0;200" keyTimes="0;0.5;0.85;1" dur="3.2s" repeatCount="indefinite"/>
      </path>
      <path d="M 12 103 C 50 102, 60 95, 72 75 S 95 37, 146 35" fill="none" stroke="#1e3a8a" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="200" stroke-dashoffset="200">
        <animate attributeName="stroke-dashoffset" values="200;0;0;200" keyTimes="0;0.5;0.85;1" dur="3.2s" repeatCount="indefinite"/>
      </path>
      <text x="120" y="29" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#1e3a8a">fwd</text>
      <text x="122" y="59" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#991b1b">rev</text>
      <text x="80" y="140" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#0f172a">qPCR</text>
      <text x="80" y="154" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">universal primer, &#916;&#916;Ct</text>
    </g>
    <line x1="978" y1="112" x2="1010" y2="112" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
    <text x="1020" y="108" font-family="Helvetica, Arial, sans-serif" font-size="10" font-style="italic" fill="#64748b">Stage 2</text>
    <text x="1020" y="121" font-family="Helvetica, Arial, sans-serif" font-size="10" font-style="italic" fill="#94a3b8">(optional)</text>
  </g>
</svg>
